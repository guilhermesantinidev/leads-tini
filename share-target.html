<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — recebendo…</title>
<meta name="theme-color" content="#14181F">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14181F;
    color: #8B93A3;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>
  <p>Abrindo…</p>
  <script>
    // share-target.html
    //
    // O Android entrega aqui o que a pessoa compartilhou (via "share_target"
    // no manifest.json), como GET ?title=...&text=...&url=...
    //
    // O Instagram costuma mandar a URL do perfil no campo "url" ou dentro
    // do "text" (varia por versão do app). Tentamos extrair o @handle de
    // qualquer um dos três campos, olhando por um link instagram.com/algo.
    //
    // Depois só redireciona pro app de verdade (index.html) passando o
    // handle encontrado — quem decide o que fazer com isso é o app.js.

    function extractHandle(str) {
      if (!str) return null;
      const match = str.match(/instagram\.com\/([a-zA-Z0-9._]+)/);
      return match ? match[1] : null;
    }

    const params = new URLSearchParams(window.location.search);
    const candidates = [params.get("url"), params.get("text"), params.get("title")];

    let handle = null;
    for (const candidate of candidates) {
      handle = extractHandle(candidate);
      if (handle) break;
    }

    const destination = handle
      ? `./index.html?novo_lead_handle=${encodeURIComponent(handle)}`
      : `./index.html`;

    window.location.replace(destination);
  </script>
</body>
</html>
